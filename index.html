<!DOCTYPE html>
<html style="margin: 0px; padding: 0px;">

<head>
    <meta charset="UTF-8">
    <title>Owain Buchnea Portfolio</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>

<body style="margin: 0px; padding: 0px; overflow-y: hidden; height: 100%;">

    <div class="image-container">
        <img id="mainImage" src="Main.png">
        <img id="hoverImage" src="Main.png">
    </div>

</body>
</html>

<script>
    const mainImage = document.getElementById("mainImage");
    const hoverImage = document.getElementById("hoverImage");
    const preloadImages = [
        "Main_OWAIN_Hover.png",
        "Main_WORKTERM1_Hover.png"
    ];

    preloadImages.forEach(src => {
        const img = new Image();
        img.src = src;
    });

    let hoveredRegion = null;

    document.addEventListener("mousemove", (e) => {
        const rect = mainImage.getBoundingClientRect();

        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (x >= 75 && x <= 750 && y >= 400 && y <= 610) {

            if (hoveredRegion !== "owain") {
                hoverImage.src = "Main_OWAIN_Hover.png";
                hoverImage.style.opacity = "1";
                hoveredRegion = "owain";
            }

        } else if (x >= 75 && x <= 300 && y >= 350 && y <= 400) {

            if (hoveredRegion !== "workterm1") {
                hoverImage.src = "Main_WORKTERM1_Hover.png";
                hoverImage.style.opacity = "1";
                hoveredRegion = "workterm1";
            }

        } else {

            if (hoveredRegion !== null) {
                hoverImage.style.opacity = "0";
                hoveredRegion = null;
            }
        }
    });

    document.addEventListener("mousedown", () => {

        if (hoveredRegion === "owain") {
            window.location.href = "about-me.html";

        } else if (hoveredRegion === "workterm1") {
            window.location.href = "workterms/workterm1.html";
        }

    });
</script>
