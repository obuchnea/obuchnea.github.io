<!DOCTYPE html>
<html style="margin: 0px; padding: 0px;">

<head>
    <meta charset="UTF-8">
    <title>Owain Buchnea Portfolio</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="styles.css">
</head>

<body style="margin: 0px; padding: 0px;">

    <div class="home-header" style="margin: 0px; padding: 0px;">

        <img id="photo" src="Main.png" style="max-width: 100%;">

        <p>Computer Science Co-op Student at the University of Guelph</p>

        <h2>Work Terms</h2>

        <ul>
            <li><a href="workterms/workterm1.html">Work Term 1</a></li>
        </ul>
    </div>

</body>
</html>

<script>
    const img = document.getElementById("photo");
    let hoveredRegion = null;

    document.addEventListener("mousemove", (e) => {
        const rect = img.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        if (x >= 75 && x <= 750 && y >= 400 && y <= 610) {
            img.src = "Main_OWAIN_Hover.png";
            hoveredRegion = "owain";
        } else if (x >= 75 && x <= 300 && y >= 350 && y <= 400) {
            img.src = "Main_WORKTERM1_Hover.png";
            hoveredRegion = "workterm1";
        } else {
            img.src = "Main.png";
            hoveredRegion = null;
        }
    });

    document.addEventListener("mousedown", () => {
        if (hoveredRegion === "owain") {
            window.location.href = "about-me.html"; // ← swap in the page you want
        } else if (hoveredRegion === "workterm1") {
            window.location.href = "workterms/workterm1.html"
        }
    });
</script>
