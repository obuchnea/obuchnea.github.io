    <div id="myModal" class="modal">
        <span class="close" id="closeBtn">&times;</span>
        <span class="nav left">&#10094;</span>
        <img class="modal-content" id="modalImg">
        <span class="nav right">&#10095;</span>
        <div id="caption"></div>
    </div>

    <script src="avecolour.js"></script>
    <script>

        function showImage(index) {
            currentIndex = index;
            modalImg.src = "gallery/" + orderedImages[index].file;
            caption.textContent = orderedImages[index].title;
            modal.classList.add("open");
        }

        function nextImage(){
            currentIndex = (currentIndex + 1) % orderedImages.length;
            showImage(currentIndex);
        }

        function previousImage(){
            currentIndex--;
            if(currentIndex < 0)
                currentIndex = orderedImages.length - 1;
            showImage(currentIndex);
        }

        function showImage(index){
            currentIndex = index;
            scale = 1;
            modalImg.style.transform = "scale(1)";
            modalImg.src = "gallery/" + orderedImages[index].file;
            caption.textContent = orderedImages[index].title;
            modal.classList.add("open");
        }

        document.querySelector(".left").onclick = previousImage;
        document.querySelector(".right").onclick = nextImage;

        const modal = document.getElementById('myModal');
        const modalImg = document.getElementById('modalImg');
        const caption = document.getElementById('caption');
        const gallery = document.getElementById("gallery");

        let currentIndex = 0;
        let scale = 1;

        modalImg.addEventListener("wheel",(e)=>{
            e.preventDefault();
            if(e.deltaY < 0)
                scale *= 1.15;
            else
                scale /= 1.15;
            scale = Math.max(1, Math.min(scale,8));
            modalImg.style.transform =
                `scale(${scale})`;
        });

        modalImg.addEventListener("mousemove",(e)=>{
            const rect = modalImg.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width * 100;
            const y = (e.clientY - rect.top) / rect.height * 100;
            modalImg.style.transformOrigin = `${x}% ${y}%`;
        });
        
        gallery.addEventListener("click", (e) => {
            if (e.target.tagName !== "IMG") return;
            showImage(Number(e.target.dataset.index));
        });
        
        function closeModal() {
            modal.classList.remove('open');
        }
        
        document.getElementById('closeBtn').addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => {
            if (e.target === modal) closeModal(); // click on backdrop closes it
        });
        document.addEventListener("keydown", (e)=>{
            if(!modal.classList.contains("open"))
                return;
            switch(e.key){
                case "ArrowLeft":
                    previousImage();
                    break;
                case "ArrowRight":
                    nextImage();
                    break;
                case "Escape":
                    closeModal();
                    break;
            }

        });
